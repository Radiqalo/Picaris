name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle and cache dependencies
        uses: gradle/actions/setup-gradle@v6

      - name: Build and run unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :core:testDebugUnitTest :designsystem:testDebugUnitTest

      - name: Compile Android instrumentation tests
        run: ./gradlew :app:compileDebugAndroidTestKotlin

      - name: Run Kotlin style and static checks
        run: ./gradlew ktlintCheck detekt

      - name: Run Android lint
        run: ./gradlew :app:lintDebug
